apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: lvmcluster-sample
  namespace: openshift-storage
  annotations:
    argocd.argoproj.io/sync-wave: "50"     
spec:
  storage:
    deviceClasses:
      - default: true
        deviceSelector:
          paths:
            - '/dev/disk/by-path/pci-0000:0f:00.0-ata-1'
            - '/dev/disk/by-path/pci-0000:0f:00.0-ata-2'
        fstype: xfs
        name: vg2
        nodeSelector:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - ws02-ocp.uct.lab
        thinPoolConfig:
          chunkSizeCalculationPolicy: Static
          metadataSizeCalculationPolicy: Host
          name: thin-pool-1
          overprovisionRatio: 10
          sizePercent: 90

