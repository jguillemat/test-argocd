apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: openshift-gitops
  annotations:
    # Wave 60 Configuración Cluster ( /platform ) 
    # Configuración propia del cluster OpenShift. 
    argocd.argoproj.io/sync-wave: "60"  
spec:
  project: default
  source:
    repoURL: git@github.com:jguillemat/test-argocd.git
    targetRevision: main
    path: platform/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
