apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: openshift-gitops
  annotations:
    # Wave 70 Observabilidad  ( /observability ) 
    # Servicios de monitorización de la plataforma/aplicaciones 
    argocd.argoproj.io/sync-wave: "70"    
spec:
  project: default
  source:
    repoURL: git@github.com:jguillemat/test-argocd.git
    targetRevision: main
    path: observability/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
