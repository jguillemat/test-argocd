apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-custom-resources
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "50"    
spec:
  project: default
  source:
    repoURL: git@github.com:jguillemat/test-argocd.git
    targetRevision: main
    path: cluster-custom-resources/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
