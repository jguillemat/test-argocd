apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: custom-crds
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-50"  
spec:
  project: default
  source:
    repoURL: git@github.com:jguillemat/test-argocd.git
    targetRevision: main
    path: custom-crds/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
