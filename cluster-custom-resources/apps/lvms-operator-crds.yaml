apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lvms-operator-crds
  namespace: openshift-gitops  
  annotations:
    # Wave 70 Configuración de CRDs ( /cluster-custom-resources ) 
    argocd.argoproj.io/sync-wave: "70"  
    argocd.argoproj.io/enable-health-check: "true"   
spec:
  project: default
  source:
    repoURL: git@github.com:jguillemat/test-argocd.git
    targetRevision: main    
    path: cluster-custom-resources/lvms-operator
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
