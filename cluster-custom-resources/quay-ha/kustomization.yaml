apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: quay-ha-crds
resources:
  - namespace-quay-ha.yaml
  
  
generatorOptions:
  disableNameSuffixHash: true  # Applies to all generators
  labels:
    generated-by: kustomize
  annotations:
    config-version: "2026-09-18"
      
secretGenerator:
- name: quay-config-quayha
  files:
  - config.yaml
  - clair-config.yaml
  - ssl.cert
  - ssl.key
  - rootCA.pem

