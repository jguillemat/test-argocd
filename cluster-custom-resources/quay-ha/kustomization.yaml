apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: quay-ha-crds
resources:
  - namespace-quay-ha.yaml
  
generatorOptions:
  
  labels:
    generated-by: kustomize
  annotations:
    ssl-cert-expires: "2027-07-19"
    extra_ca_cert_quayha-ca-expires: "2029-05-18"

secretGenerator:
- name: quay-config-quayha
  files:
  - config.yaml
  - clair-config.yaml
  - ssl.cert
  - ssl.key
  - extra_ca_cert_quayha-ca.crt
  options:
    disableNameSuffixHash: true  # Only this generator

