apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: quay-ha-crds
resources:
  - namespace-quay-ha.yaml

secretGenerator:
- name: quay-config-quayha
  namespace: quay-ha
  files:
  - config.yaml=config.yaml
  - clair-config.yaml=clair-config.yaml
  - ssl.cert=ssl.cert
  - ssl.key=ssl.key
  - extra_ca_cert_quayha-ca.crt=extra_ca_cert_quayha-ca.crt
  options:
    disableNameSuffixHash: true  # Only this generator
    labels:
      generated-by: kustomize
    annotations:
      certificate-ssl-cert-expires: "2027-07-19"
      certificate-extra_ca_cert_quayha-ca-expires: "2029-05-18"      

