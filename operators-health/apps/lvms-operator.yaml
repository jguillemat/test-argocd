apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lvms-operator-health
  namespace: openshift-gitops  
  annotations:
    # Wave 35 Operadores Healthchecks ( /operators-health ) 
    argocd.argoproj.io/sync-wave: "35"
    argocd.argoproj.io/enable-health-check: "true"    
spec:
  project: default
  source:
    repoURL: git@github.com:jguillemat/test-argocd.git
    targetRevision: main    
    path: operators-health/lvms-operator
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
