apiVersion: tuned.openshift.io/v1  
kind: Tuned  
metadata:  
  name: master-ioscheduler
  namespace: openshift-cluster-node-tuning-operator  
spec:  
  profile:  
  - name: openshift-master-ioscheduler
    data: |  
      [main]  
      summary=A custom OpenShift for Disk Scheduler profile  
      include=openshift-control-plane  
      [disk]  
      devices=sda, sdb  
      elevator=none  
  recommend:  
  - profile: openshift-master-ioscheduler 
    match:  
    - label: node-role.kubernetes.io/master  
    priority: 10  
