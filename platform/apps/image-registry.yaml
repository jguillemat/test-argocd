apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: image-registry
  namespace: openshift-gitops  
spec:
  project: default
  source:
    repoURL: git@github.com:jguillemat/test-argocd.git
    targetRevision: main    
    path: platform/image-registry
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
