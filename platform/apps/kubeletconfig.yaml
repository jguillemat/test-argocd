apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kubeletconfig
  namespace: openshift-gitops  
  annotations:
    # Wave 60 Configuración Cluster ( /platform ) 
    argocd.argoproj.io/sync-wave: "60"    
spec:
  project: default
  source:
    repoURL: git@github.com:jguillemat/test-argocd.git
    targetRevision: main    
    path: platform/kubeletconfig
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true      
  ignoreDifferences:
    - group: "*"
      kind: "*"
      jsonPointers:
        - /metadata/annotations/kubectl.kubernetes.io/last-applied-configuration         
