apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-root
  namespace: openshift-gitops
  annotations:
    # Wave 0 Aplicación raíz (App of Apps)  ( /bootstrap ) 
    argocd.argoproj.io/sync-wave: "0"    
spec:
  project: default
  source:
    repoURL: git@github.com:jguillemat/test-argocd.git
    targetRevision: main
    path: bootstrap/argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
