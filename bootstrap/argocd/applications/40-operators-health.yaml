apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: operators-health
  namespace: openshift-gitops
  annotations:
    # Wave 40 Operadores Healthchecks ( /operators-health ) 
    argocd.argoproj.io/sync-wave: "40"    
    argocd.argoproj.io/enable-health-check: "true"
spec:
  project: default
  source:
    repoURL: git@github.com:jguillemat/test-argocd.git
    targetRevision: main
    path: operators-health/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
