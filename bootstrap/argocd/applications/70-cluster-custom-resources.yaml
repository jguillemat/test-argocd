apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-custom-resources
  namespace: openshift-gitops
  annotations:
    # Wave 70 Configuración de CRDs ( /cluster-custom-resources ) 
    argocd.argoproj.io/sync-wave: "70"   
    argocd.argoproj.io/enable-health-check: "true" 
spec:
  project: default
  source:
    repoURL: git@github.com:jguillemat/test-argocd.git
    targetRevision: main
    path: cluster-custom-resources/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
