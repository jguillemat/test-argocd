---
kind: ConfigMap
apiVersion: v1
metadata:
  name: argocd-cm
  namespace: openshift-gitops
data:
  resource.customizations.health.apps_Deployment: |
    hs = {}
    if obj.status ~= nil and
      obj.status.conditions ~= nil then
      for i, condition in ipairs(obj.status.conditions) do
          if condition.type == "Available" and
              condition.status == "True" then
              hs.status = "Healthy"
              hs.message = "Deployment Available"
              return hs
          end
      end
      hs.status = "Progressing"
      hs.message = "Waiting for Available=True"
      return hs
    end
    hs.status = "Progressing"
    hs.message = "Deployment not ready"
    return hs      
  resource.customizations.health.argoproj.io_Application: |
    if obj.metadata.annotations ~= nil then
        if obj.metadata.annotations["argocd.argoproj.io/enable-health-check"] == "true" then
            hs = {}
            hs.status = "Progressing"
            hs.message = ""
            if obj.status ~= nil then
                if obj.status.health ~= nil then
                    hs.status = obj.status.health.status
                    if obj.status.health.message ~= nil then
                        hs.message = obj.status.health.message
                    end
                end
            end
            return hs
        end
    end
    hs = {}
    hs.status = "Healthy"
    hs.message = "health check is not enabled for this application"
    return hs
  resource.customizations.health.operators.coreos.com_ClusterServiceVersion: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.phase == "Succeeded" then
          hs.status = "Healthy"
          hs.message = obj.status.message
          return hs
      end
      hs.status = "Progressing"
      hs.message = obj.status.phase
      return hs
    end
    hs.status = "Progressing"
    return hs        
  resource.customizations.health.operators.coreos.com_Subscription: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.installedCSV ~= nil then
        hs.status = "Healthy"
        hs.message = obj.status.installedCSV
        return hs
      end
    end
    hs.status = "Progressing"
    hs.message = "Waiting for Operator installation"
    return hs        

